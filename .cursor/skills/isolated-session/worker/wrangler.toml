# The landing-lease Worker. No account is named here: this directory is vendored into other
# repositories, and each adopter deploys it to their own Cloudflare account, which wrangler
# takes from the environment (in Muretai's tree: `cf web` from company/ops/deploy/cf-account.sh).
# No route either: the hostname wrangler assigns on deploy is enough, and the client reads
# it from its own configuration ([lease] url, or endpoint= in <dispatch dir>/node).
name = "landing-lease"
main = "worker.mjs"
compatibility_date = "2025-09-01"

[[durable_objects.bindings]]
name = "LANDING_LEASE"
class_name = "LandingLease"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["LandingLease"]

# The DID allowlist is a SECRET, never a committed value:
#   wrangler secret put LEASE_ALLOWLIST     (a JSON array of did:key strings)
# Optional plain variable: LEASE_TTL_S (default 900).
