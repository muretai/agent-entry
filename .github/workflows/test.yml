name: test

on:
  pull_request:
    branches: [main]
  merge_group:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      # conformance/seam-twin.mjs fails, by design, when no agent-seam checkout sits beside
      # the primary checkout: its sibling rows prove the vendored seam is what the pinned
      # commit produces. A full clone, tags included, so the pinned commit and ref resolve.
      - name: Clone agent-seam beside this checkout
        run: git clone --quiet https://github.com/muretai/agent-seam "$GITHUB_WORKSPACE/../agent-seam"
      - run: npm test
