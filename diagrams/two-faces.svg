<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 420" role="img" aria-labelledby="t d">
  <title id="t">One declaration, two faces: the page and the door</title>
  <desc id="d">agent-entry.json lists offers keyed by verbs. Publish signs it into /.well-known/agent-tools.json. On the page, agent-entry-page.mjs verifies the contract and registers the offers as WebMCP tools for a person's agent in the tab. At the door, the same offers are the card's skills and the signed replies to POST / for an agent alone. A page tool that changes or pays hands off to the door. Both faces end at one account: the visitor's key.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#111"/>
    </marker>
  </defs>
  <rect width="740" height="420" fill="#fafafa"/>
  <text x="24" y="26" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#666">One declaration, keyed by what a customer can do. Two faces are generated from it.</text>

  <rect x="170" y="40" width="400" height="64" rx="10" fill="#fff" stroke="#111"/>
  <text x="370" y="66" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="700" fill="#111">agent-entry.json</text>
  <text x="370" y="90" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#555">offers: find · ask · quote · book · hold · buy · …</text>

  <line x1="370" y1="104" x2="370" y2="132" stroke="#111" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="380" y="123" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#666">agent-entry publish (signed with the site's seed)</text>

  <rect x="120" y="136" width="500" height="44" rx="10" fill="#fff" stroke="#111" stroke-dasharray="4 3"/>
  <text x="370" y="163" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#111">/.well-known/agent-tools.json  +  .sig.json  (agenttools)</text>

  <line x1="250" y1="180" x2="180" y2="206" stroke="#111" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="490" y1="180" x2="560" y2="206" stroke="#111" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="20" y="210" width="320" height="130" rx="10" fill="#111"/>
  <text x="180" y="238" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="700" fill="#fff">On the page: a person is in the tab</text>
  <text x="180" y="266" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#ddd">agent-entry-page.mjs verifies, then</text>
  <text x="180" y="288" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#ddd">registers WebMCP tools</text>
  <text x="180" y="314" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, monospace" font-size="12" fill="#bbb">find_products  hold_item  buy_order</text>

  <rect x="400" y="210" width="320" height="130" rx="10" fill="#fff" stroke="#111"/>
  <text x="560" y="238" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="700" fill="#111">At the door: the agent is alone</text>
  <text x="560" y="266" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#555">the card's skills[], one per offer</text>
  <text x="560" y="288" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#555">POST /  message/send  →  signed reply</text>
  <text x="560" y="314" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, monospace" font-size="12" fill="#666">{verb, of, customer_did, status, deal?}</text>

  <text x="370" y="270" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#666">handoff</text>
  <line x1="342" y1="280" x2="398" y2="280" stroke="#111" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="20" y="356" width="700" height="48" rx="10" fill="#fff" stroke="#111"/>
  <text x="370" y="385" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="700" fill="#111">One account: the visitor's key. The first signed knock opens it.</text>
</svg>
