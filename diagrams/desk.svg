<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 300" role="img" aria-labelledby="t d">
  <title id="t">This file serves GET the Agent Card, then POST the door</title>
  <desc id="d">llms.txt, WebMCP and MCP sit beside this file. This file answers GET /.well-known/agent-card.json with 200 (the contract) and POST message/send with 200 (the signed reply).</desc>
  <rect width="740" height="300" fill="#fafafa"/>
  <text x="24" y="26" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#666">What a site may run. This file is only the last box: the card and the door.</text>
  <rect x="20" y="40" width="170" height="72" rx="8" fill="#fff" stroke="#bbb"/>
  <text x="105" y="68" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="700" fill="#444">llms.txt</text>
  <text x="105" y="90" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#666">GET brochure</text>
  <rect x="198" y="40" width="170" height="72" rx="8" fill="#fff" stroke="#111"/>
  <text x="283" y="68" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="700" fill="#111">WebMCP</text>
  <text x="283" y="90" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#555">tools in the page</text>
  <rect x="376" y="40" width="170" height="72" rx="8" fill="#fff" stroke="#111"/>
  <text x="461" y="68" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="700" fill="#111">MCP server</text>
  <text x="461" y="90" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#555">HTTP + a token</text>
  <rect x="554" y="40" width="166" height="72" rx="8" fill="#111"/>
  <text x="637" y="68" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="700" fill="#fff">Agent Entry</text>
  <text x="637" y="90" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#ddd">this file</text>
  <rect x="20" y="128" width="700" height="152" rx="10" fill="#fff" stroke="#111"/>
  <rect x="40" y="148" width="52" height="22" rx="4" fill="#111"/>
  <text x="66" y="164" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#fff">GET</text>
  <text x="400" y="164" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="700" fill="#111">/.well-known/agent-card.json   200</text>
  <text x="370" y="188" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#555">the contract, before anyone knocks: DID, url, how to sign (AE-8)</text>
  <path d="M370 200v14" stroke="#111" stroke-width="1.5"/>
  <polygon points="370,220 365,212 375,212" fill="#111"/>
  <rect x="40" y="228" width="56" height="22" rx="4" fill="#111"/>
  <text x="68" y="244" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#fff">POST</text>
  <text x="400" y="244" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="700" fill="#111">/   A2A message/send   200</text>
  <text x="370" y="268" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#111">already formed correctly; signed reply, same request (AE-20)</text>
</svg>
