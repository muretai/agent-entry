<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 440" role="img" aria-labelledby="t d">
  <title id="t">GET the Agent Card first (200), then POST the door (200). Not x402.</title>
  <desc id="d">x402 teaches with HTTP 402 and a retry. Agent Entry publishes the contract on GET /.well-known/agent-card.json as 200, before anyone knocks. The first signed POST is the act and is answered 200. Protocol refusals are JSON-RPC on HTTP 200, not HTTP 402.</desc>
  <rect width="740" height="440" fill="#fafafa"/>
  <text x="24" y="26" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#666">Siblings sit beside this file. This file: GET the card (200), then POST the door (200).</text>
  <rect x="20" y="40" width="170" height="72" rx="8" fill="#fff" stroke="#bbb"/>
  <text x="105" y="68" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="700" fill="#444">llms.txt</text>
  <text x="105" y="90" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#666">GET brochure</text>
  <rect x="198" y="40" width="170" height="72" rx="8" fill="#fff" stroke="#111"/>
  <text x="283" y="68" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="700" fill="#111">WebMCP</text>
  <text x="283" y="90" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#555">tools in the page</text>
  <rect x="376" y="40" width="170" height="72" rx="8" fill="#fff" stroke="#111"/>
  <text x="461" y="68" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="700" fill="#111">MCP server</text>
  <text x="461" y="90" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#555">HTTP + a token</text>
  <rect x="554" y="40" width="166" height="72" rx="8" fill="#111"/>
  <text x="637" y="68" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="700" fill="#fff">Agent Entry</text>
  <text x="637" y="90" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#ddd">this file</text>
  <rect x="20" y="128" width="700" height="292" rx="10" fill="#fff" stroke="#111"/>
  <rect x="40" y="148" width="52" height="22" rx="4" fill="#111"/>
  <text x="66" y="164" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#fff">GET</text>
  <text x="400" y="164" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="700" fill="#111">/.well-known/agent-card.json   200</text>
  <text x="370" y="188" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#555">terms before anyone knocks: DID, url, how to sign (AE-8)</text>
  <path d="M370 200v16" stroke="#111" stroke-width="1.5"/>
  <polygon points="370,222 365,214 375,214" fill="#111"/>
  <rect x="40" y="232" width="56" height="22" rx="4" fill="#111"/>
  <text x="68" y="248" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#fff">POST</text>
  <text x="400" y="248" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="700" fill="#111">/   A2A message/send   200</text>
  <text x="370" y="274" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#111">already formed correctly; signed reply, same request (AE-20)</text>
  <text x="370" y="308" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#555">x402: ask for the resource, get HTTP 402, then retry with payment.</text>
  <text x="370" y="326" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#555">AE: read the card first. The POST is not a retry after an error.</text>
  <text x="370" y="354" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#666">A refusal here is JSON-RPC on HTTP 200, not HTTP 402 (AE-19).</text>
  <text x="370" y="376" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#666">Handoff from WebMCP or MCP names this DID. This file is the landing.</text>
  <text x="370" y="398" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#666">No person in the tab? POST here or use MCP. Do not scrape WebMCP.</text>
</svg>
